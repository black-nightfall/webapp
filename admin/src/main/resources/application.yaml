spring:
  application:
    name: admin
  docker:
    compose:
      project-name: admin-dev
      file: ./infra/docker/docker-compose.yml
      profiles:
        active: dev
  # 数据库配置
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:appdb}
    username: ${POSTGRES_USER:appuser}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: changeme
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
      # 显式配置连接参数
      client-type: lettuce
      connect-timeout: 10000ms

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /admin

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-at-least-256-bits-for-hs256-algorithm-security}
  expiration: 86400000 # 24 hours in milliseconds
  header: Authorization
  prefix: Bearer

# 认证配置（用于初始数据）
auth:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

# 日志配置
logging:
  level:
    com.night.admin: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
